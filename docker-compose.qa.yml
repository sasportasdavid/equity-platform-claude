version: '3.8'

# Capiwise — QA / E2E infrastructure
#
# Mailpit : SMTP catcher local pour les tests E2E (auth magic links,
# invitation emails, notifications Resend redirected via SMTP).
#
# Usage :
#   docker compose -f docker-compose.qa.yml up -d
#   docker compose -f docker-compose.qa.yml down
#
# UI : http://localhost:8025
# SMTP : localhost:1025 (auth accepted, plain text OK pour testing)
# API : http://localhost:8025/api/v1/messages

services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: capiwise-mailpit-qa
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI + API REST
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:8025/']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mailpit_data:
