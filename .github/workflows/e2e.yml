name: E2E Tests (Playwright)

# PR #44 — Foundation E2E. Lance la suite Playwright sur :
#   - Pull requests vers master
#   - Push sur master (regression continue)
#
# Service container Mailpit (SMTP catcher local pour les emails).
# Secrets requis dans Settings → Secrets and variables → Actions :
#   - SUPABASE_URL_QA       (cloud QA, peut == dev cloud V1)
#   - SUPABASE_ANON_KEY_QA
#   - SUPABASE_SERVICE_KEY_QA
#   - E2E_BYPASS_SECRET     (≠ prod !!!)

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
        options: >-
          --health-cmd "wget --quiet --tries=1 --spider http://localhost:8025/"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
          run_install: false

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run E2E suite
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL_QA }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_QA }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY_QA }}
          E2E_BYPASS_SECRET: ${{ secrets.E2E_BYPASS_SECRET }}
          MAILPIT_URL: http://localhost:8025
          NODE_ENV: test
        run: pnpm --filter web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30
