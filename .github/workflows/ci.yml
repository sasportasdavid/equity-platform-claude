name: CI

# Gates unitaires sur chaque PR vers master et chaque push sur master :
# typecheck strict + lint + tests Vitest (1366+ tests).
# Complète e2e.yml (Playwright) — avant ce workflow, aucune CI ne tournait
# sur les tests unitaires (audit 2026-06-10 P0-6).

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Version lue depuis packageManager (pnpm@10.33.2)
          run_install: false

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (Vitest)
        run: pnpm test
